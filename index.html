<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LK-HACKERS ARSENAL</title>
    <style>
        /* 1. ප්‍රධාන පසුබිම සහ Font සෙටින්ග්ස් */
        body {
            background-color: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 2. Header (ටීම් එකේ නම) */
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px dashed #00ff41;
            width: 100%;
            max-width: 800px;
            padding-bottom: 10px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin: 0;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.7);
        }

        .header p {
            color: #888;
            font-size: 0.9rem;
        }

        /* 3. ටූල්ස් ටික පෙළගස්වන Grid එක (PC සහ Mobile දෙකටම හැඩගැහෙනවා) */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        /* 4. Tools වල Cards (බටන්ස්) */
        .tool-card {
            background-color: #121212;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* මවුස් එක උඩට යද්දී වෙනස් වන ලස්සන Effect එක */
        .tool-card:hover {
            border-color: #00ff41;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.4);
            transform: translateY(-3px);
        }

        .tool-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: #ffffff;
        }

        .tool-card p {
            margin: 0;
            font-size: 0.85rem;
            color: #8cc8ff;
        }

        /* Terminal Footer */
        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #444;
        }
    </style>
</head>
